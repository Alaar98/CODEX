[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-mission"
version = "0.1.0"
description = "TRACE — Tracking and Reacquisition Architecture for Cooperative Estimation of Uncorrelated Space Objects"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "sgp4==2.27"]

[tool.setuptools.packages.find]
where = ["src"]
